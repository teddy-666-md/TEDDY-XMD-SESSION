<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEDDY-XMD | PAIR CODE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff41;
            --secondary: #00cc33;
            --accent: #00ff88;
            --text: #e0e0e0;
            --text-light: #888;
            --background: #000;
            --card-bg: rgba(0, 255, 65, 0.05);
            --input-bg: rgba(0, 255, 65, 0.08);
            --success: #00ff41;
            --error: #ff0041;
            --warning: #ffaa00;
            --shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            padding: 20px;
            position: relative;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

       .home-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: transparent;
            color: var(--primary);
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--primary);
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

       .home-btn:hover {
            background: var(--primary);
            color: var(--dark);
            box-shadow: 0 0 25px var(--primary);
        }

       .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border: 1px solid rgba(0, 255, 65, 0.3);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease-out;
            z-index: 1;
            margin-top: 2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

       .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            position: relative;
        }

       .logo i {
            font-size: 100px;
            color: var(--primary);
            text-shadow: 0 0 30px var(--primary);
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        h1 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 20px var(--primary);
            letter-spacing: 2px;
        }

        p {
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

       .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

       .input-container {
            position: relative;
            margin-bottom: 1.5rem;
        }

       .input-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid rgba(0, 255, 65, 0.3);
            background-color: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

       .btn {
            background: transparent;
            color: var(--primary);
            padding: 15px;
            border: 2px solid var(--primary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            position: relative;
            overflow: hidden;
        }

       .btn:hover {
            background: var(--primary);
            color: var(--dark);
            box-shadow: 0 0 25px var(--primary);
        }

       .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border: 1px solid var(--primary);
            display: none;
            animation: fadeIn 0.3s ease-out;
            text-align: center;
            font-weight: 500;
            background-color: rgba(0, 255, 65, 0.05);
        }

        #loading-spinner {
            display: none;
            margin: 1.5rem 0;
        }

       .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto;
            border: 3px solid rgba(0, 255, 65, 0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #pair-code {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 1rem 0;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--primary);
            font-family: 'Courier New', monospace;
        }

       .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

       .action-btn {
            flex: 1;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

       .copy-btn {
            background-color: var(--primary);
            color: var(--dark);
            border: 2px solid var(--primary);
        }

       .copy-btn:hover {
            box-shadow: 0 0 20px var(--primary);
        }

       .back-btn {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

       .back-btn:hover {
            background-color: var(--primary);
            color: var(--dark);
        }

       .error-message {
            color: var(--error);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
            text-shadow: 0 0 10px var(--error);
        }

       .success-message {
            color: var(--success);
            margin-top: 1rem;
            display: none;
            text-shadow: 0 0 10px var(--success);
        }

        @media (max-width: 480px) {
           .container { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
           .action-buttons { flex-direction: column; gap: 0.5rem; }
           .home-btn {
                top: 1rem;
                right: 1rem;
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <a href="./" class="home-btn">
        <i class="fas fa-home"></i> HOME
    </a>

    <div class="container">
        <div class="logo">
            <i class="fas fa-terminal"></i>
        </div>

        <h1>TEDDY-XMD PAIR</h1>
        <p>Enter your WhatsApp number without + sign</p>

        <div class="form-group">
            <label for="phone-number">Phone Number</label>
            <div class="input-container">
                <i class="fas fa-hashtag"></i>
                <input type="text" id="phone-number" placeholder="2547xxxxxxxx" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="error-message" id="error-message">INVALID NUMBER [10-15 DIGITS]</div>
        </div>

        <button id="submit" class="btn">
            <span id="btn-text">[ EXECUTE ]</span>
            <span id="btn-spinner" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i>
            </span>
        </button>

        <div id="loading-spinner" class="spinner"></div>

        <div id="result">
            <p>> PAIRING CODE GENERATED</p>
            <div id="pair-code"></div>
            <p>> Enter this code in WhatsApp > Linked Devices</p>

            <div class="action-buttons">
                <button id="copy-btn" class="action-btn copy-btn">
                    <i class="fas fa-copy"></i> COPY
                </button>
                <a href="./" class="action-btn back-btn">
                    <i class="fas fa-arrow-left"></i> BACK
                </a>
            </div>

            <div class="success-message" id="success-message">
                [ COPIED TO CLIPBOARD ]
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = '01アイウエオカキクケコサシスセソタチツテト';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        const draw = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };
        setInterval(draw, 35);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Logic
        const submitButton = document.getElementById('submit');
        const phoneNumberInput = document.getElementById('phone-number');
        const resultDiv = document.getElementById('result');
        const pairCodeDiv = document.getElementById('pair-code');
        const copyButton = document.getElementById('copy-btn');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        function validatePhoneNumber(number) {
            const cleaned = number.replace(/\D/g, '');
            return cleaned.length >= 10 && cleaned.length <= 15;
        }

        submitButton.addEventListener('click', async (e) => {
            e.preventDefault();
            const phoneNumber = phoneNumberInput.value.trim();

            if (!validatePhoneNumber(phoneNumber)) {
                errorMessage.style.display = 'block';
                return;
            }

            errorMessage.style.display = 'none';
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            submitButton.disabled = true;

            try {
                const { data } = await axios.get(`/code?number=${phoneNumber}`);
                const code = data.code || "ERROR";
                pairCodeDiv.textContent = code;
                resultDiv.style.display = 'block';
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (error) {
                pairCodeDiv.textContent = "SERVICE ERROR";
                resultDiv.style.display = 'block';
                console.error("Error:", error);
            } finally {
                btnText.style.display = 'inline-block';
                btnSpinner.style.display = 'none';
                submitButton.disabled = false;
            }
        });

        copyButton.addEventListener('click', () => {
            const code = pairCodeDiv.textContent;
            navigator.clipboard.writeText(code).then(() => {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 2000);
            });
        });

        phoneNumberInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            if (errorMessage.style.display === 'block') {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
